[pytest]
# Upgrade snapshots under runtime/ contain a verbatim copy of tests/ with the
# same module basenames. Without an explicit root, a bare `pytest` collects
# both and aborts with "import file mismatch". Keep collection anchored to the
# live test tree; backup copies are archives, not test suites.
testpaths = tests
norecursedirs = runtime data-local upstream .venv .git
